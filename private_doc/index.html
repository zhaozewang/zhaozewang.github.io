    const iterations = 350000;

    const b64ToBytes = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));

    async function deriveKey(passphrase) {
      const encoded = new TextEncoder().encode(passphrase);
      const keyMaterial = await crypto.subtle.importKey("raw", encoded, "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(saltB64), iterations, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function unlock() {
      const input = document.getElementById("passphrase");
      const error = document.getElementById("error");
      error.textContent = "";

        const key = await deriveKey(input.value);
        const encrypted = b64ToBytes(encryptedPayload);
        const decrypted = await crypto.subtle.decrypt(
