<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Score SDE</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>

    body { max-width: 940px; margin: 42px auto; padding: 0 18px 80px; font: 16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; color:#111; background:#fff; }
    a { color:#0645ad; text-underline-offset:3px; }
    h1 { font-size: 34px; line-height:1.16; margin: 10px 0 12px; }
    h2 { font-size: 23px; margin: 42px 0 14px; line-height:1.25; border-top:1px solid #ddd; padding-top:26px; }
    h3 { font-size: 18px; margin: 24px 0 8px; }
    p { margin: 10px 0; }
    .topnav, .bottomnav, .meta { color:#555; font-size:14px; }
    .lead { font-size:18px; }
    .note { border:1px solid #ddd; background:#fafafa; padding:14px 16px; border-radius:6px; margin:18px 0; }
    .formula-card { border:1px solid #ddd; border-radius:6px; overflow:hidden; margin:18px 0; }
    .formula-title { background:#f6f6f6; border-bottom:1px solid #ddd; padding:12px 14px; font-weight:700; }
    .math { padding:12px 14px; overflow-x:auto; }
    details { border-top:1px solid #eee; padding:12px 14px 14px; }
    summary { cursor:pointer; font-weight:700; }
    .derive ol { padding-left:22px; }
    .derive li { margin:7px 0; }
    .example { background:#fffbe8; border-left:3px solid #d7a700; padding:8px 10px; }
    figure { margin:24px 0; }
    img { max-width:100%; height:auto; border:1px solid #ddd; border-radius:6px; }
    figcaption { color:#555; font-size:14px; margin-top:8px; }
    pre { overflow-x:auto; background:#f7f7f7; border:1px solid #ddd; border-radius:6px; padding:14px; line-height:1.5; }
    code { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.92em; }
    table { width:100%; border-collapse:collapse; margin:16px 0; }
    th,td { border-bottom:1px solid #ddd; padding:10px 8px; text-align:left; vertical-align:top; }
    th { background:#f7f7f7; }
    @media (max-width:720px){ body{margin-top:28px;} h1{font-size:28px;} }
  
    .unlock {
      max-width: 460px;
      margin: 90px auto;
      padding: 0;
    }
    .unlock label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }
    .unlock input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 11px;
      border: 1px solid #bbb;
      font: inherit;
    }
    .unlock button {
      margin-top: 14px;
      padding: 8px 13px;
      border: 1px solid #222;
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }
    .unlock .error {
      min-height: 1.5em;
      color: #9b1c1c;
      margin-top: 12px;
    }
  </style>
</head>

    <input id="passphrase" type="password" autocomplete="current-password" autofocus>
    <button id="openDoc" type="button">Open</button>
    <p class="error" id="error"></p>
  </main>
